name: TypeScript migration validation

on:
  push:
    branches:
      - typescript-migration
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install TypeScript for validation
        run: npm install --no-save --no-package-lock typescript@latest

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build registry
        run: npm run registry:build

      - name: Verify registry
        run: npm run registry:verify

      - name: Production build
        run: npm run build

      - name: Existing test suite
        run: npm test
